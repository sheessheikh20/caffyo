<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" width="100%" height="100%">
  <defs>
    <linearGradient id="caffyoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1ad"/>
      <stop offset="40%" stop-color="#dfc282"/>
      <stop offset="70%" stop-color="#caa256"/>
      <stop offset="100%" stop-color="#b68939"/>
    </linearGradient>
    <linearGradient id="caffyoGoldStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8e7be"/>
      <stop offset="50%" stop-color="#d4af62"/>
      <stop offset="100%" stop-color="#b88f40"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g id="zauq-emblem" transform="translate(0, 5)">
    <!-- Vertical Capsule / Arch Outline -->
    <rect x="145" y="15" width="110" height="175" rx="55" ry="55" 
          fill="none" stroke="url(#caffyoGoldStroke)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Coffee Cup & Latte Art (centered within lower half of capsule) -->
    <g transform="translate(200, 115)">
      <!-- Saucer under cup -->
      <path d="M -44,22 C -44,38 44,38 44,22" fill="none" stroke="url(#caffyoGoldStroke)" stroke-width="3" stroke-linecap="round"/>
      
      <!-- Cup Body -->
      <path d="M -38,-2 C -36,25 -22,34 0,34 C 22,34 36,25 38,-2" 
            fill="none" stroke="url(#caffyoGoldStroke)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Cup Handle -->
      <path d="M 37,2 C 51,2 54,20 35,22" 
            fill="none" stroke="url(#caffyoGoldStroke)" stroke-width="3.5" stroke-linecap="round"/>

      <!-- Cup Rim / Liquid Surface Ellipse -->
      <ellipse cx="0" cy="-2" rx="38" ry="17" 
               fill="none" stroke="url(#caffyoGoldStroke)" stroke-width="3.8"/>

      <!-- Inner Latte Art Foam Ring -->
      <ellipse cx="0" cy="-2" rx="29" ry="12.5" 
               fill="none" stroke="url(#caffyoGoldStroke)" stroke-width="2" stroke-dasharray="2 1"/>

      <!-- Heart / Rosette Motif inside coffee -->
      <!-- Center Heart -->
      <path d="M 0,-7 C -3,-12 -10,-10 -9,-5 C -8,-1 0,3 0,4 C 0,3 8,-1 9,-5 C 10,-10 3,-12 0,-7 Z" 
            fill="url(#caffyoGold)" />
      
      <!-- Concentric Cream Swirls -->
      <path d="M -16,-3 C -14,3 0,6 0,6 C 0,6 14,3 16,-3" 
            fill="none" stroke="url(#caffyoGoldStroke)" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M -22,-5 C -18,5 0,9 0,9 C 0,9 18,5 22,-5" 
            fill="none" stroke="url(#caffyoGoldStroke)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M -8,-9 C -15,-6 -14,0 -5,2" 
            fill="none" stroke="url(#caffyoGoldStroke)" stroke-width="1.8" stroke-linecap="round"/>
      <path d="M 8,-9 C 15,-6 14,0 5,2" 
            fill="none" stroke="url(#caffyoGoldStroke)" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Typography: CAFFYO -->
  <g transform="translate(200, 268)">
    <text text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', -apple-system, sans-serif" 
          font-size="46" 
          font-weight="600" 
          letter-spacing="9" 
          fill="url(#caffyoGold)">CAFFYO</text>
  </g>

  <!-- Typography: — BY ZAUQ — -->
  <g transform="translate(200, 318)">
    <!-- Left Accent Rule -->
    <line x1="-140" y1="-5" x2="-80" y2="-5" stroke="url(#caffyoGoldStroke)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Subtitle Text -->
    <text text-anchor="middle" 
          font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', -apple-system, sans-serif" 
          font-size="18" 
          font-weight="500" 
          letter-spacing="7" 
          fill="url(#caffyoGold)">BY ZAUQ</text>
    
    <!-- Right Accent Rule -->
    <line x1="80" y1="-5" x2="140" y2="-5" stroke="url(#caffyoGoldStroke)" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
