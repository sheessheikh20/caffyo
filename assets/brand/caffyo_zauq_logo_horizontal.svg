<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="100%" height="100%">
  <defs>
    <linearGradient id="navCaffyoWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="navCaffyoWhiteStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Left Capsule Emblem (scaled to fit 60px height) -->
  <g id="nav-emblem" transform="translate(10, 4) scale(0.32)">
    <!-- Capsule outline -->
    <rect x="0" y="0" width="104" height="175" rx="52" ry="52" 
          fill="none" stroke="url(#navCaffyoWhiteStroke)" stroke-width="5" stroke-linecap="round"/>

    <!-- Coffee Cup & Latte Art inside capsule -->
    <g transform="translate(52, 105)">
      <!-- Saucer -->
      <path d="M -40,22 C -40,36 40,36 40,22" fill="none" stroke="url(#navCaffyoWhiteStroke)" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Cup Body -->
      <path d="M -34,-2 C -32,23 -18,32 0,32 C 18,32 32,23 34,-2" 
            fill="none" stroke="url(#navCaffyoWhiteStroke)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Cup Handle -->
      <path d="M 33,2 C 46,2 49,18 31,20" 
            fill="none" stroke="url(#navCaffyoWhiteStroke)" stroke-width="4" stroke-linecap="round"/>
      <!-- Cup Rim -->
      <ellipse cx="0" cy="-2" rx="34" ry="15" 
               fill="none" stroke="url(#navCaffyoWhiteStroke)" stroke-width="4.2"/>
      <!-- Heart -->
      <path d="M 0,-6 C -3,-11 -9,-9 -8,-4 C -7,-1 0,3 0,4 C 0,3 7,-1 8,-4 C 9,-9 3,-11 0,-6 Z" 
            fill="url(#navCaffyoWhite)" />
      <!-- Cream ripples -->
      <path d="M -14,-2 C -12,3 0,6 0,6 C 0,6 12,3 14,-2" fill="none" stroke="url(#navCaffyoWhiteStroke)" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M -20,-4 C -16,5 0,8 0,8 C 0,8 16,5 20,-4" fill="none" stroke="url(#navCaffyoWhiteStroke)" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="60" y1="14" x2="60" y2="56" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Brand Typography -->
  <g transform="translate(76, 0)">
    <!-- CAFFYO -->
    <text x="0" y="38" 
          font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', -apple-system, sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="5.5" 
          fill="#ffffff">CAFFYO</text>

    <!-- BY ZAUQ with accent lines -->
    <g transform="translate(0, 52)">
      <line x1="0" y1="-3" x2="22" y2="-3" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" stroke-linecap="round"/>
      <text x="32" y="1" 
            font-family="'Plus Jakarta Sans', 'Outfit', 'Montserrat', -apple-system, sans-serif" 
            font-size="11.5" 
            font-weight="500" 
            letter-spacing="4.5" 
            fill="rgba(255, 255, 255, 0.85)">BY ZAUQ</text>
      <line x1="140" y1="-3" x2="162" y2="-3" stroke="rgba(255, 255, 255, 0.6)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>
